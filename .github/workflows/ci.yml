name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
      - name: Syntax check
        run: find task-board tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php tests/run.php
